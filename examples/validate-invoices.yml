# Example workflow for this repository (same-repo checkout).
#
# Downstream consumers: pin `facturxapi/validate-einvoice@<40-char-sha>` from the
# release notes (v1.1.2: a805a904f9fa1a7d51db5a4160e863748cc3733d). The moving
# `@v1` tag is a mutable convenience channel that follows the latest v1.x.y.

name: Validate EN16931 invoices

on:
  pull_request:
    paths:
      - '**/*.xml'
  push:
    paths:
      - '**/*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run official EN16931 1.3.16 XSLT
        id: en16931
        uses: ./
        with:
          files: testdata/official/*.xml
          syntax: auto
          fail-on: failed-assert
          version: '1.3.16'

      - name: Show verdict
        if: always()
        run: |
          echo "verdict=${{ steps.en16931.outputs.verdict }}"
          echo "failed-count=${{ steps.en16931.outputs.failed-count }}"
          echo "report-sha256=${{ steps.en16931.outputs.report-sha256 }}"
