# Example consumer workflow.
# After publication, pin the Marketplace tag. Until then, use `uses: ./`
# when this repository is the workflow checkout.

name: Validate EN16931 invoices

on:
  pull_request:
    paths:
      - '**/*.xml'
  push:
    paths:
      - '**/*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run official EN16931 1.3.16 XSLT
        id: en16931
        uses: facturxapi/validate-einvoice@v1
        with:
          files: testdata/official/*.xml
          syntax: auto
          fail-on: failed-assert
          version: '1.3.16'

      - name: Show verdict
        if: always()
        run: |
          echo "verdict=${{ steps.en16931.outputs.verdict }}"
          echo "failed-count=${{ steps.en16931.outputs.failed-count }}"
          echo "report-sha256=${{ steps.en16931.outputs.report-sha256 }}"
