name: Self-test EN16931 action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  selftest:
    name: selftest ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run portable selftest
        run: python scripts/selftest.py
      - name: Upload canonical reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selftest-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: selftest-reports/
          if-no-files-found: error

  action-official:
    name: action official ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Official examples must pass
        uses: ./
        with:
          files: testdata/official/*.xml
          syntax: auto
          fail-on: failed-assert

  action-mutants:
    name: action mutants ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mutants must fail the job
        id: mutants
        continue-on-error: true
        uses: ./
        with:
          files: testdata/mutants/*.xml
          syntax: auto
          fail-on: failed-assert
      - name: Require failure and exact ids
        env:
          MUTANT_OUTCOME: ${{ steps.mutants.outcome }}
          MUTANT_VERDICT: ${{ steps.mutants.outputs.verdict }}
          MUTANT_REPORT: ${{ steps.mutants.outputs.report }}
        run: python scripts/check_mutant_report.py

  selftest-gate:
    name: selftest-gate
    needs: [selftest, action-official, action-mutants]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require needed jobs
        env:
          SELFTEST_RESULT: ${{ needs.selftest.result }}
          OFFICIAL_RESULT: ${{ needs.action-official.result }}
          MUTANTS_RESULT: ${{ needs.action-mutants.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          results = {
              "selftest": os.environ["SELFTEST_RESULT"],
              "action-official": os.environ["OFFICIAL_RESULT"],
              "action-mutants": os.environ["MUTANTS_RESULT"],
          }
          print("needed jobs:", results)
          bad = [name for name, value in results.items() if value != "success"]
          if bad:
              print("SELFTEST-GATE FAIL: needed job not success:", results, file=sys.stderr)
              sys.exit(1)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download selftest reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: selftest-reports-*
          path: selftest-reports-all
          merge-multiple: false
      - name: Compare reports across OS
        run: python3 scripts/check_selftest_gate.py selftest-reports-all
