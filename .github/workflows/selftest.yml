name: Self-test EN16931 action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run portable selftest
        run: python scripts/selftest.py

  action-official:
    name: action official ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Official examples must pass
        uses: ./
        with:
          files: testdata/official/*.xml
          syntax: auto
          fail-on: failed-assert

  action-mutants:
    name: action mutants ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mutants must fail the job
        id: mutants
        continue-on-error: true
        uses: ./
        with:
          files: testdata/mutants/*.xml
          syntax: auto
          fail-on: failed-assert
      - name: Require failure and exact ids
        env:
          MUTANT_OUTCOME: ${{ steps.mutants.outcome }}
          MUTANT_VERDICT: ${{ steps.mutants.outputs.verdict }}
          MUTANT_REPORT: ${{ steps.mutants.outputs.report }}
        run: python scripts/check_mutant_report.py
