name: Self-test EN16931 action

on:
  push:
    paths:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Official examples must pass
        uses: ./
        with:
          files: testdata/official/*.xml
          syntax: auto
          fail-on: failed-assert

  mutants-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutants must fail the job
        id: mutants
        continue-on-error: true
        uses: ./
        with:
          files: testdata/mutants/*.xml
          syntax: auto
          fail-on: failed-assert
      - name: Require failure and exact ids
        env:
          MUTANT_OUTCOME: ${{ steps.mutants.outcome }}
          MUTANT_VERDICT: ${{ steps.mutants.outputs.verdict }}
          MUTANT_REPORT: ${{ steps.mutants.outputs.report }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          if os.environ.get("MUTANT_OUTCOME") != "failure":
              print("mutant job did not fail", file=sys.stderr)
              sys.exit(1)
          if os.environ.get("MUTANT_VERDICT") != "fail":
              print("mutant verdict is not fail", file=sys.stderr)
              sys.exit(1)
          expected = json.loads(Path("testdata/expected-ids.json").read_text(encoding="utf-8"))
          report = json.loads(os.environ["MUTANT_REPORT"])
          got = {Path(row["path"]).name: row["failed_assert_ids"] for row in report["files"]}
          errors = []
          for name, ids in expected.items():
              if got.get(name) != ids:
                  errors.append(f"{name}: expected {ids}, got {got.get(name)}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("mutants: exact ids, job failed")
          PY

  local-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/selftest.sh
        run: bash scripts/selftest.sh
