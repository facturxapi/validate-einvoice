name: Supply-chain gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify action pins, hashed lock, and tree digest
        run: python scripts/check_supply_chain.py
      - name: Supply-chain unit tests
        run: python -m unittest discover -s tests -p 'test_supply_chain.py' -v
